services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xpto_courses
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xpto_courses"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@db:5432/xpto_courses
    ports: ["3001:3001"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["8081:80"]
    depends_on: [api]

volumes:
  pgdata:
